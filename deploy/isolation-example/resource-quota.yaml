# Ограничение ресурсов, потребляемых ВСЕМИ подами внутри Namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  namespace: isolation-example
  name: resource-quota
spec:
  hard:
    pods: "10"
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    persistentvolumeclaims: "5"
    requests.storage: "100Gi"
