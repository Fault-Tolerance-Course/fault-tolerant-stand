events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Производительность
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;

    # Безопасность
    server_tokens off;

    # Логи в stdout для Docker
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    upstream api_gateway {
        server api-gateway:8080; # Имя сервиса из docker-compose.yml
    }

    server {
        listen 80;

        # Добавляем таймаут в заголовок
        proxy_set_header X-Request-Timeout 5s;

        # Таймауты
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 7s;

        # Заголовки для Go приложения
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Все запросы на Go сервис
        location / {
            proxy_pass http://api_gateway;
        }
    }
}